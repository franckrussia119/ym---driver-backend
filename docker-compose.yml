services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ymtransit}
      POSTGRES_USER: ${POSTGRES_USER:-ymtransit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ymtransit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ymtransit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ymtransit}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      PORT: 4000
      UPLOAD_DIR: /app/uploads
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - uploads:/app/uploads
    ports:
      - "4000:4000"

volumes:
  pgdata:
  uploads:
